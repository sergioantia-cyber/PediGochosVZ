<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgMovil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bgMovil)"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="#FDBA74" stroke-width="2.5" opacity="0.6"/>
  <!-- Dynamic Speed Scooter / Vehicle Icon -->
  <g transform="translate(100, 84)">
    <circle cx="-28" cy="20" r="14" fill="#1E293B" stroke="#FF6B00" stroke-width="3"/>
    <circle cx="28" cy="20" r="14" fill="#1E293B" stroke="#FF6B00" stroke-width="3"/>
    <!-- Chassis -->
    <path d="M-28,20 L-6,14 L12,-16 L-2,-16" stroke="#FFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-6,14 L28,20" stroke="#FFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="-22" r="7" fill="#FDE047"/>
    <!-- Speed Lines -->
    <line x1="-50" y1="6" x2="-38" y2="6" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
    <line x1="-56" y1="16" x2="-44" y2="16" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Text Brand -->
  <text x="100" y="160" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="15" fill="#FFF" letter-spacing="2">PEDIGOCHOS MÓVIL</text>
  <text x="100" y="177" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="9" fill="#FED7AA" letter-spacing="1">MOTO TAXI &amp; AUTOS</text>
</svg>
