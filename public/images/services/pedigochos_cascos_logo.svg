<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visorGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Visor Reflection -->
    <linearGradient id="visorReflect" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Helmet Shell Gradient -->
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Orange Accent Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="12" y="12" width="488" height="488" rx="96" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12"/>

  <!-- Carbon Fiber Grid Texture Subtlety -->
  <g opacity="0.07">
    <pattern id="carbonPat" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FFF"/>
      <rect x="8" y="8" width="8" height="8" fill="#FFF"/>
    </pattern>
    <rect x="20" y="20" width="472" height="472" rx="90" fill="url(#carbonPat)"/>
  </g>

  <!-- Decorative Speed Lines -->
  <g stroke="#FF6B00" stroke-width="3" opacity="0.3" stroke-linecap="round">
    <line x1="70" y1="140" x2="130" y2="140"/>
    <line x1="50" y1="165" x2="110" y2="165"/>
    <line x1="382" y1="140" x2="442" y2="140" stroke="#F43F5E"/>
    <line x1="402" y1="165" x2="462" y2="165" stroke="#F43F5E"/>
  </g>

  <!-- Top Star Badge: ECE 22.06 -->
  <g transform="translate(256, 75)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#E11D48" opacity="0.95"/>
    <text x="0" y="5" font-family="'Outfit', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ECE 22.06 • DOT</text>
  </g>

  <!-- ==================== HELMET ARTWORK ==================== -->
  <g id="helmet-group" transform="translate(0, 10)">
    <!-- Helmet Outer Shell (Aerodynamic Sport Shape) -->
    <path d="M 140 250 
             C 135 170, 190 115, 256 115 
             C 322 115, 377 170, 372 250 
             C 370 295, 350 330, 320 345 
             C 290 358, 260 360, 256 360 
             C 252 360, 222 358, 192 345 
             C 162 330, 142 295, 140 250 Z" 
          fill="url(#shellGrad)" stroke="#475569" stroke-width="4"/>

    <!-- Helmet Racing Stripes (PediGochos Orange & Crimson) -->
    <path d="M 238 116 C 244 115, 252 115, 256 115 C 260 115, 268 115, 274 116 L 274 180 L 238 180 Z" fill="#FF6B00"/>
    <path d="M 226 120 L 234 120 L 234 180 L 226 180 Z" fill="#F43F5E"/>
    <path d="M 278 120 L 286 120 L 286 180 L 278 180 Z" fill="#F43F5E"/>

    <!-- Aerodynamic Top Air Vent Scoop -->
    <polygon points="220,135 292,135 284,152 228,152" fill="#0F172A" stroke="#FF6B00" stroke-width="2"/>
    <line x1="256" y1="135" x2="256" y2="152" stroke="#475569" stroke-width="2"/>

    <!-- Visor Pivot Pods (Mechanisms left & right) -->
    <circle cx="162" cy="235" r="16" fill="#0F172A" stroke="#FF6B00" stroke-width="3"/>
    <circle cx="162" cy="235" r="7" fill="#E11D48"/>
    <circle cx="350" cy="235" r="16" fill="#0F172A" stroke="#FF6B00" stroke-width="3"/>
    <circle cx="350" cy="235" r="7" fill="#E11D48"/>

    <!-- Visor Outer Silhouette (Sport Shield) -->
    <path d="M 162 235
             C 175 190, 215 178, 256 178
             C 297 178, 337 190, 350 235
             C 345 280, 310 292, 256 292
             C 202 292, 167 280, 162 235 Z"
          fill="url(#visorGrad)" stroke="#38BDF8" stroke-width="3.5"/>

    <!-- Visor Reflection Sheen -->
    <path d="M 175 220 
             C 210 185, 260 183, 300 190 
             C 265 198, 215 210, 185 240 Z" 
          fill="url(#visorReflect)"/>

    <!-- Chin Bar & Lower Deflector -->
    <path d="M 178 305
             C 205 320, 230 326, 256 326
             C 282 326, 307 320, 334 305
             L 325 342
             C 295 356, 265 358, 256 358
             C 247 358, 217 356, 187 342 Z"
          fill="#0F172A" stroke="#334155" stroke-width="2.5"/>

    <!-- Chin Air Intake Mesh Grill -->
    <polygon points="230,328 282,328 276,346 236,346" fill="#020617" stroke="#FF6B00" stroke-width="2"/>
    <line x1="242" y1="337" x2="270" y2="337" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- ==================== BRANDING LOWER BANNER ==================== -->
  <g transform="translate(256, 415)">
    <!-- Plate Background with Gradient Edge -->
    <rect x="-200" y="-36" width="400" height="72" rx="20" fill="#0A0F1D" stroke="url(#ringGrad)" stroke-width="3"/>
    
    <!-- Brand Title: PEDIGOCHOS -->
    <text x="0" y="-2" font-family="'Outfit', 'Impact', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      PEDI<tspan fill="#FF6B00">GOCHOS</tspan>
    </text>

    <!-- Subtitle: RIDER • MOTO & CASCOS -->
    <text x="0" y="23" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="12.5" font-weight="800" fill="#FDA4AF" text-anchor="middle" letter-spacing="3.5">
      RIDER • MOTO STORE
    </text>
  </g>
</svg>
