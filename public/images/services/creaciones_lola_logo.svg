<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgLola" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0519"/>
      <stop offset="40%" stop-color="#881337"/>
      <stop offset="80%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="burritoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="25%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="75%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="lolaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card with rounded corners -->
  <rect width="200" height="200" rx="44" fill="url(#bgLola)"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="#FDE047" stroke-width="2.5" opacity="0.75"/>

  <!-- Confetti sprinkles -->
  <circle cx="28" cy="30" r="3" fill="#F43F5E"/>
  <circle cx="170" cy="35" r="3" fill="#38BDF8"/>
  <circle cx="24" cy="115" r="2.5" fill="#FACC15"/>
  <circle cx="176" cy="120" r="3" fill="#A855F7"/>
  <polygon points="160,20 164,25 158,26" fill="#34D399"/>
  <polygon points="36,18 42,20 38,26" fill="#FB923C"/>

  <!-- Central Donkey Piñata of Creaciones Lola -->
  <g transform="translate(100, 78)" filter="url(#lolaGlow)">
    
    <!-- Tail fringes -->
    <path d="M-30,12 Q-44,22 -38,36" stroke="#F43F5E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-28,15 Q-40,28 -32,38" stroke="#FACC15" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-30,14 Q-36,25 -26,38" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Piñata Body Layers -->
    <!-- Layer 4: Cyan/Blue Belly -->
    <path d="M-28,14 L28,14 L28,8 L-28,8 Z" fill="#38BDF8"/>
    <!-- Layer 3: Yellow/Orange Middle -->
    <path d="M-28,8 L28,8 L28,0 L-28,0 Z" fill="#FACC15"/>
    <!-- Layer 2: Orange/Pink Middle -->
    <path d="M-28,0 L28,0 L28,-8 L-28,-8 Z" fill="#FB923C"/>
    <!-- Layer 1: Rose Pink Back -->
    <path d="M-28,-8 L28,-8 L24,-14 L-24,-14 Z" fill="#F43F5E"/>

    <!-- Fringe trim zig-zags on body -->
    <path d="M-28,14 L-24,18 L-20,14 L-16,18 L-12,14 L-8,18 L-4,14 L0,18 L4,14 L8,18 L12,14 L16,18 L20,14 L24,18 L28,14" fill="none" stroke="#FDE047" stroke-width="1.5"/>

    <!-- Legs (4 Piñata Legs) -->
    <!-- Rear Left -->
    <rect x="-24" y="14" width="7" height="24" rx="3.5" fill="#EC4899"/>
    <rect x="-24" y="32" width="7" height="6" fill="#FACC15"/>
    <!-- Rear Right -->
    <rect x="-14" y="14" width="6" height="22" rx="3" fill="#8B5CF6"/>
    <rect x="-14" y="30" width="6" height="6" fill="#06B6D4"/>
    <!-- Front Left -->
    <rect x="12" y="14" width="6" height="22" rx="3" fill="#8B5CF6"/>
    <rect x="12" y="30" width="6" height="6" fill="#06B6D4"/>
    <!-- Front Right -->
    <rect x="20" y="14" width="7" height="24" rx="3.5" fill="#EC4899"/>
    <rect x="20" y="32" width="7" height="6" fill="#FACC15"/>

    <!-- Neck and Head -->
    <!-- Neck -->
    <path d="M12,-8 L24,-24 L34,-20 L28,-8 Z" fill="#F43F5E"/>
    <!-- Head -->
    <ellipse cx="28" cy="-26" rx="14" ry="10" fill="#FB923C" transform="rotate(-15 28 -26)"/>
    <!-- Snout -->
    <ellipse cx="38" cy="-29" rx="8" ry="6" fill="#FDE047" transform="rotate(-15 38 -29)"/>
    <circle cx="42" cy="-30" r="1.5" fill="#831843"/>
    <!-- Eye with happy sparkle -->
    <circle cx="28" cy="-28" r="3.5" fill="#FFF"/>
    <circle cx="29" cy="-28" r="2" fill="#0F172A"/>
    <circle cx="28.5" cy="-29" r="0.8" fill="#FFF"/>

    <!-- Ears -->
    <polygon points="19,-32 14,-46 23,-36" fill="#F43F5E" stroke="#FFF" stroke-width="1"/>
    <polygon points="24,-34 22,-48 30,-38" fill="#38BDF8" stroke="#FFF" stroke-width="1"/>

    <!-- Mane fringes -->
    <path d="M14,-22 Q8,-26 12,-32" stroke="#FDE047" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M18,-15 Q12,-18 16,-24" stroke="#34D399" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Balloons & Scissors decoration -->
    <circle cx="-38" cy="-24" r="8" fill="#F43F5E" stroke="#FFF" stroke-width="1"/>
    <path d="-38,-16 Q-38,-6 -34,0" stroke="#FFF" stroke-width="1" fill="none"/>
    <circle cx="-26" cy="-32" r="7" fill="#38BDF8" stroke="#FFF" stroke-width="1"/>
    <path d="-26,-25 Q-28,-14 -32,-2" stroke="#FFF" stroke-width="1" fill="none"/>
  </g>

  <!-- Typography Brand -->
  <text x="100" y="158" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="15" fill="#FFF" letter-spacing="1.5">CREACIONES LOLA</text>
  <text x="100" y="176" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="9" fill="#FDE047" letter-spacing="1">PIÑATAS PERSONALIZADAS</text>
</svg>
