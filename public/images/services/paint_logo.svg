<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgPaint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="50%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bgPaint)"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="#FDBA74" stroke-width="2.5" opacity="0.6"/>
  <!-- Sports Car Silhouette with Spray Wave -->
  <g transform="translate(100, 84)">
    <!-- Aerodynamic car silhouette -->
    <path d="M-50,14 C-46,4 -36,-4 -22,-6 L-8,-18 C-4,-21 12,-21 28,-14 L44,-4 C52,0 56,8 56,14 L-50,14 Z" fill="url(#flameGrad)"/>
    <path d="M-54,16 L58,16" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="-32" cy="18" r="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="-32" cy="18" r="4" fill="#FFF"/>
    <circle cx="36" cy="18" r="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="36" cy="18" r="4" fill="#FFF"/>
    <!-- Spray Gun Glow Effect -->
    <path d="M-40,-32 Q-20,-24 0,-34 Q20,-44 40,-30" fill="none" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- Text Brand -->
  <text x="100" y="160" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="14.5" fill="#FFF" letter-spacing="2">TALLER AUTOMOTRIZ</text>
  <text x="100" y="177" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="9" fill="#FDBA74" letter-spacing="1">LATONERÍA &amp; AL HORNO</text>
</svg>
