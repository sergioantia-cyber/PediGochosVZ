    <path d="M-36,8 C-32,0 -24,-6 -14,-7 L-4,-18 C-1,-20 12,-20 22,-15 L32,-7 C38,-4 42,2 42,8 L-36,8 Z" fill="url(#paintCarGrad)" stroke="#FFF" stroke-width="1.8"/>
    <!-- Wheels -->
    <circle cx="-22" cy="10" r="7" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="-22" cy="10" r="3" fill="#FFF"/>
    <circle cx="26" cy="10" r="7" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="26" cy="10" r="3" fill="#FFF"/>
    <line x1="-40" y1="17" x2="44" y2="17" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Spray gun spray arcs -->
    <path d="M-28,-24 Q-14,-18 0,-26 Q14,-32 28,-22" fill="none" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-2" cy="-28" r="2" fill="#FDE047"/>
    <circle cx="16" cy="-22" r="1.5" fill="#FDE047"/>
