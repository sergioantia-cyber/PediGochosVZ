<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="movilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <g transform="translate(50, 48)">
    <!-- Scooter Body -->
    <path d="M-24,14 L-6,14 L0,2 L14,2 L18,-18 L24,-18" stroke="#FF6B00" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="24" cy="-18" r="3" fill="#FFF"/>
    <!-- Seat & Chassis -->
    <path d="M-16,4 L-4,4 L0,12 L-14,12 Z" fill="url(#movilGrad)"/>
    <rect x="-18" y="0" width="16" height="4" rx="2" fill="#1E293B"/>
    <!-- Rear Wheel -->
    <circle cx="-22" cy="14" r="8" fill="#1E293B" stroke="#FF6B00" stroke-width="2.5"/>
    <circle cx="-22" cy="14" r="3" fill="#FFF"/>
    <!-- Front Wheel -->
    <circle cx="20" cy="14" r="8" fill="#1E293B" stroke="#FF6B00" stroke-width="2.5"/>
    <circle cx="20" cy="14" r="3" fill="#FFF"/>
    <!-- Headlight beam -->
    <path d="M26,-14 L40,-18 L40,-8 Z" fill="#FDE047" opacity="0.6"/>
    <!-- Speed streaks -->
    <line x1="-34" y1="-2" x2="-24" y2="-2" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="-38" y1="4" x2="-28" y2="4" stroke="#FDBA74" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
