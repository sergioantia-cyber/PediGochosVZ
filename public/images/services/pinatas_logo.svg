<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgPinata" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0519"/>
      <stop offset="50%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#FB923C"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="pinataGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bgPinata)"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="#FDA4AF" stroke-width="2.5" opacity="0.6"/>
  <!-- Festive Star Piñata -->
  <g transform="translate(100, 88)" filter="url(#pinataGlow)">
    <!-- Central Sphere -->
    <circle cx="0" cy="0" r="28" fill="url(#starGrad)" stroke="#FFF" stroke-width="2"/>
    <!-- Cone Cones of traditional 7-peak star piñata -->
    <polygon points="0,-26 -14,-56 14,-56" fill="#F43F5E" stroke="#FFF" stroke-width="1.5"/>
    <polygon points="0,26 -14,56 14,56" fill="#F59E0B" stroke="#FFF" stroke-width="1.5"/>
    <polygon points="-26,0 -56,-14 -56,14" fill="#3B82F6" stroke="#FFF" stroke-width="1.5"/>
    <polygon points="26,0 56,-14 56,14" fill="#10B981" stroke="#FFF" stroke-width="1.5"/>
    <polygon points="-18,-18 -46,-46 -32,-52" fill="#EC4899" stroke="#FFF" stroke-width="1.5"/>
    <polygon points="18,-18 46,-46 32,-52" fill="#8B5CF6" stroke="#FFF" stroke-width="1.5"/>
    <polygon points="-18,18 -46,46 -52,32" fill="#F97316" stroke="#FFF" stroke-width="1.5"/>
    <polygon points="18,18 46,46 52,32" fill="#06B6D4" stroke="#FFF" stroke-width="1.5"/>
    <!-- Confetti streamers -->
    <path d="M-14,-56 Q-25,-70 -12,-78" stroke="#FDE047" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M14,-56 Q25,-70 12,-78" stroke="#EC4899" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="-38" cy="-12" r="3" fill="#FDE047"/>
    <circle cx="42" cy="-28" r="3" fill="#38BDF8"/>
    <circle cx="-28" cy="38" r="3" fill="#34D399"/>
  </g>
  <!-- Text Brand -->
  <text x="100" y="160" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="14.5" fill="#FFF" letter-spacing="2">TALLER PIÑATAS</text>
  <text x="100" y="177" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="9" fill="#FDA4AF" letter-spacing="1">CREATIVAS &amp; FIESTAS</text>
</svg>
