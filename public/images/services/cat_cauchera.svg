<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Outer Tire Rubber -->
  <circle cx="50" cy="50" r="38" fill="url(#tireGrad)" stroke="#EF4444" stroke-width="3"/>
  <!-- Tire treads -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,5"/>
  <!-- Metallic Rim -->
  <circle cx="50" cy="50" r="22" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="50" cy="50" r="8" fill="#EF4444"/>
  <!-- Rim spokes -->
  <line x1="50" y1="28" x2="50" y2="42" stroke="#CBD5E1" stroke-width="2.5"/>
  <line x1="50" y1="58" x2="50" y2="72" stroke="#CBD5E1" stroke-width="2.5"/>
  <line x1="28" y1="50" x2="42" y2="50" stroke="#CBD5E1" stroke-width="2.5"/>
  <line x1="58" y1="50" x2="72" y2="50" stroke="#CBD5E1" stroke-width="2.5"/>
  <!-- 24H Badge -->
  <rect x="58" y="14" width="28" height="16" rx="5" fill="#EF4444" stroke="#FFF" stroke-width="1.2"/>
  <text x="72" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="9" fill="#FFF">24H</text>
</svg>
