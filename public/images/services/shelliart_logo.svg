<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgShelli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0427"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
    <linearGradient id="resinLetter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#DB2777" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9D174D" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="keychainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="44" fill="url(#bgShelli)"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="url(#goldRing)" stroke-width="2.5" opacity="0.65"/>

  <!-- LLAVERO ARTESANAL EN RESINA (Authentic Resin Keychain) -->
  <g transform="translate(100, 78)" filter="url(#keychainGlow)">
    
    <!-- 1. Metallic Golden Keyring (Aro del Llavero) -->
    <circle cx="-16" cy="-42" r="16" fill="none" stroke="url(#goldRing)" stroke-width="4.5"/>
    <circle cx="-16" cy="-42" r="11.5" fill="none" stroke="#451A03" stroke-width="1.2" opacity="0.4"/>
    
    <!-- Chain Links (Eslabones de cadena dorada) -->
    <circle cx="-16" cy="-21" r="3.5" fill="none" stroke="url(#goldRing)" stroke-width="2.5"/>
    <circle cx="-16" cy="-14" r="3.5" fill="none" stroke="url(#goldRing)" stroke-width="2.5"/>

    <!-- 2. Hanging Tassel (Borla artesanal) on the right of the ring -->
    <path d="M-2,-30 L10,-24" stroke="url(#goldRing)" stroke-width="2"/>
    <!-- Tassel Cap -->
    <rect x="7" y="-23" width="8" height="5" rx="2.5" fill="url(#goldRing)"/>
    <!-- Tassel Skirt -->
    <path d="M7,-18 L3,-1 Q11,4 19,-1 L15,-18 Z" fill="url(#tasselGrad)" stroke="#FFF" stroke-width="0.8"/>
    <!-- Tassel Fringe Lines -->
    <line x1="8" y1="-18" x2="6" y2="0" stroke="#FCE7F3" stroke-width="0.8" opacity="0.8"/>
    <line x1="11" y1="-18" x2="11" y2="2" stroke="#FCE7F3" stroke-width="0.8" opacity="0.8"/>
    <line x1="14" y1="-18" x2="16" y2="0" stroke="#FCE7F3" stroke-width="0.8" opacity="0.8"/>

    <!-- 3. Resin Letter Initial 'S' with 24K Gold Leaf Flakes -->
    <!-- Drop shadow / 3D depth of resin -->
    <path d="M4,-8 C4,-8 0,-14 -14,-14 C-26,-14 -32,-7 -32,2 C-32,15 -12,17 -12,25 C-12,31 -18,34 -25,34 C-33,34 -38,28 -38,28 L-42,35 C-42,35 -35,43 -24,43 C-12,43 -3,35 -3,24 C-3,9 -23,8 -23,1 C-23,-4 -19,-6 -14,-6 C-9,-6 -4,-2 -4,-2 Z" fill="#370617" opacity="0.7" transform="translate(1, 2)"/>
    
    <!-- Main Crystal Resin 'S' Body -->
    <path d="M4,-8 C4,-8 0,-14 -14,-14 C-26,-14 -32,-7 -32,2 C-32,15 -12,17 -12,25 C-12,31 -18,34 -25,34 C-33,34 -38,28 -38,28 L-42,35 C-42,35 -35,43 -24,43 C-12,43 -3,35 -3,24 C-3,9 -23,8 -23,1 C-23,-4 -19,-6 -14,-6 C-9,-6 -4,-2 -4,-2 Z" fill="url(#resinLetter)" stroke="#FFF" stroke-width="2" stroke-linejoin="round"/>

    <!-- Embedded 24K Gold Leaf Flakes inside resin -->
    <polygon points="-16,-9 -12,-11 -13,-7 -10,-8" fill="url(#goldRing)"/>
    <polygon points="-24,-5 -20,-8 -22,-3" fill="url(#goldRing)"/>
    <polygon points="-28,3 -25,0 -26,6 -30,4" fill="url(#goldRing)"/>
    <polygon points="-20,10 -16,13 -18,7" fill="url(#goldRing)"/>
    <polygon points="-10,18 -8,22 -12,24" fill="url(#goldRing)"/>
    <polygon points="-17,25 -13,29 -14,24 -11,26" fill="url(#goldRing)"/>
    <polygon points="-26,30 -22,33 -23,28" fill="url(#goldRing)"/>
    <polygon points="-32,32 -30,35 -34,36" fill="url(#goldRing)"/>
    
    <!-- Top Glass Gloss Highlight Reflection -->
    <path d="M-13,-12 C-20,-12 -28,-7 -28,2 C-28,8 -22,10 -18,10" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M-23,32 C-16,32 -8,29 -8,23" fill="none" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Sparkles -->
    <path d="M12,-38 Q12,-32 18,-32 Q12,-32 12,-26 Q12,-32 6,-32 Q12,-32 12,-38 Z" fill="url(#goldRing)"/>
    <path d="M-36,-22 Q-36,-18 -32,-18 Q-36,-18 -36,-14 Q-36,-18 -40,-18 Q-36,-18 -36,-22 Z" fill="#FFF"/>
    <circle cx="2" cy="18" r="2" fill="url(#goldRing)"/>
  </g>

  <!-- Typography Brand -->
  <text x="100" y="159" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="16" fill="#FFF" letter-spacing="2.5">SHELLIART</text>
  <text x="100" y="177" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="9" fill="#FBCFE8" letter-spacing="1.2">LLAVEROS EN RESINA</text>
</svg>
