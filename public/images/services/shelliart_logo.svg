<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgResin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="50%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bgResin)"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>
  <g transform="translate(100, 92)" filter="url(#glow)">
    <!-- Gem / Crystal Diamond Shape -->
    <polygon points="0,-48 42,-14 26,44 -26,44 -42,-14" fill="url(#goldGrad)" opacity="0.25"/>
    <polygon points="0,-48 42,-14 26,44 -26,44 -42,-14" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <line x1="-42" y1="-14" x2="42" y2="-14" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9"/>
    <line x1="0" y1="-48" x2="0" y2="44" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="-48" x2="-18" y2="-14" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="0" y1="-48" x2="18" y2="-14" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="-18" y1="-14" x2="-26" y2="44" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="18" y1="-14" x2="26" y2="44" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Sparkles -->
    <path d="M-42,-34 Q-36,-34 -36,-40 Q-36,-34 -30,-34 Q-36,-34 -36,-28 Q-36,-34 -42,-34 Z" fill="#FFF"/>
    <path d="M36,-30 Q40,-30 -40,-35 Q40,-30 44,-30 Q40,-30 40,-25 Q40,-30 36,-30 Z" fill="#FEF08A"/>
    <path d="M42,28 Q46,28 46,24 Q46,28 50,28 Q46,28 46,32 Q46,28 42,28 Z" fill="#FFF"/>
  </g>
  <!-- Text Brand -->
  <text x="100" y="162" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="16" fill="#FFF" letter-spacing="3">SHELLIART</text>
  <text x="100" y="178" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="9" fill="#FBCFE8" letter-spacing="1">RESINA &amp; JOYERÍA</text>
</svg>
